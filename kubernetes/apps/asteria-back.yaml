---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asteria-back
  namespace: asteria-jdr
spec:
  replicas: 0
  selector:
    matchLabels:
      app: asteria-back
  template:
    metadata:
      labels:
        app: asteria-back
    spec:
      containers:
      - name: asteria-back
        image: docker.io/library/asteria-jdr-back:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: TZ
          value: "Europe/Paris"
        - name: DB_HOST
          value: "postgres.infrastructure.svc.cluster.local"
        - name: CORS_ORIGIN
          value: "https://asteria-jdr.fr"
        - name: ASTERIA_DB_NAME
          valueFrom:
            secretKeyRef:
              name: asteria-back-secrets
              key: ASTERIA_DB_NAME
        - name: ASTERIA_DB_USER
          valueFrom:
            secretKeyRef:
              name: asteria-back-secrets
              key: ASTERIA_DB_USER
        - name: ASTERIA_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: asteria-back-secrets
              key: ASTERIA_DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: asteria-back-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: asteria-back
  namespace: asteria-jdr
spec:
  selector:
    app: asteria-back
  ports:
  - port: 80
    targetPort: 3000
