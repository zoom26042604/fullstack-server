---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asteria-front
  namespace: asteria-jdr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asteria-front
  template:
    metadata:
      labels:
        app: asteria-front
    spec:
      containers:
      - name: asteria-front
        image: docker.io/library/asteria-jdr-front:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: asteria-front
  namespace: asteria-jdr
spec:
  selector:
    app: asteria-front
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: asteria-front
  namespace: asteria-jdr
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - asteria-jdr.fr
    - www.asteria-jdr.fr
    secretName: asteria-front-tls
  rules:
  - host: asteria-jdr.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: asteria-front
            port:
              number: 80
  - host: www.asteria-jdr.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: asteria-front
            port:
              number: 80
