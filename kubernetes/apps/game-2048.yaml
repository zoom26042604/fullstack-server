---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: game2048-pvc
  namespace: zoom2604
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-2048
  namespace: zoom2604
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-2048
  template:
    metadata:
      labels:
        app: game-2048
    spec:
      containers:
      - name: game-2048
        image: game-2048:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          value: "postgresql://postgres:$(POSTGRES_PASSWORD)@postgres.infrastructure.svc.cluster.local:5432/game2048?schema=public"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              namespace: infrastructure
              key: POSTGRES_PASSWORD
        - name: TZ
          value: "Europe/Paris"
        volumeMounts:
        - name: game-data
          mountPath: /app/data
        resources:
          requests:
            memory: "200Mi"
            cpu: "100m"
          limits:
            memory: "400Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: game-data
        persistentVolumeClaim:
          claimName: game2048-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: game-2048
  namespace: zoom2604
spec:
  selector:
    app: game-2048
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-2048
  namespace: zoom2604
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - 2048.zoom2604.dev
    secretName: game2048-tls
  rules:
  - host: 2048.zoom2604.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: game-2048
            port:
              number: 80
