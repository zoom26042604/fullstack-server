---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-azrael
  namespace: nathan-ferre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-azrael
  template:
    metadata:
      labels:
        app: portfolio-azrael
    spec:
      containers:
      - name: portfolio
        image: portfolio-azrael:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: TZ
          value: "Europe/Paris"
        resources:
          requests:
            memory: "200Mi"
            cpu: "100m"
          limits:
            memory: "400Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-azrael
  namespace: nathan-ferre
spec:
  selector:
    app: portfolio-azrael
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-azrael
  namespace: nathan-ferre
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - nathan-ferre.fr
    - www.nathan-ferre.fr
    secretName: portfolio-tls
  rules:
  - host: nathan-ferre.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portfolio-azrael
            port:
              number: 80
  - host: www.nathan-ferre.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portfolio-azrael
            port:
              number: 80
