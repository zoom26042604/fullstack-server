---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  node-exporter-full.json: |
    {
      "dashboard": {
        "id": null,
        "uid": "rYdddlPWk",
        "title": "Node Exporter Full",
        "tags": ["node-exporter"],
        "timezone": "browser",
        "schemaVersion": 16,
        "version": 0,
        "refresh": "30s"
      },
      "folderUid": "",
      "overwrite": true
    }
  
  kubernetes-cluster.json: |
    {
      "dashboard": {
        "id": null,
        "uid": "efa86fd1d0c121a26444b636a3f509a8",
        "title": "Kubernetes Cluster",
        "tags": ["kubernetes"],
        "timezone": "browser",
        "schemaVersion": 16,
        "version": 0,
        "refresh": "10s"
      },
      "folderUid": "",
      "overwrite": true
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
      - name: 'node-exporter'
        orgId: 1
        folder: 'Node Exporter'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/node-exporter
      - name: 'kubernetes'
        orgId: 1
        folder: 'Kubernetes'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-kube-prometheus-prometheus:9090
        isDefault: true
        editable: true
